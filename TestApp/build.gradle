android {
    namespace 'com.puzzlegames.puzzlebrickslegend'
    compileSdk 36

    defaultConfig {
        applicationId "com.puzzlegames.puzzlebrickslegend"
        minSdk 24
        targetSdk 36
        versionCode 277
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = [
                parfkaUrl                  : 'http://gateway-3.hierugo.com',
                ivy_debug                  : true,
                din                        : true,
                ivy_app_id                 : 2677,
                ivy_notch                  : true,
                parfka_appToken            : 'ap2677',
                gms_games_app_id           : "",
                gms_play_services_id       : "",
                google_admob_application_id: 'ca-app-pub-1914768831611213~9943063227',
                facebook_app_id            : '399035434011888',
                facebook_client_token      : '52496f240311006305e44033afe1b012',
                applovin_sdk_key           : 'E8pVhU9mykQd3y0TD0Ksoq4vpf_Muat6ifcP9m96UakTWk5klQaWEeQ2IPOA-GHgxu54eEA8pvgKcn2MBdtQGH',
                aps_id                     : '800e3de9-2864-4c1b-b0c7-af59eea8f658',
                ivy_splash                 : false
        ]
    }

    signingConfigs {
        release {
            storeFile file('com.puzzlegames.puzzlebrickslegend.keystore')
            storePassword '123456'
            keyAlias 'com.puzzlegames.puzzlebrickslegend'
            keyPassword '123456'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig = true
        aidl = true
    }
}

