plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
}
apply {
    from('../upload.gradle')
}

android {
    namespace 'com.ivy.xiaomiads'
    compileSdk rootProject.ext.android.compileSdk

    defaultConfig {
        minSdk rootProject.ext.android.minSdk
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        debug {
            debuggable rootProject.ext.buildConfig.debug_debuggable
            minifyEnabled rootProject.ext.buildConfig.debug_minifyEnabled
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled rootProject.ext.buildConfig.release_minifyEnabled
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // if (!isMavenCentral) {
        publishing {
            singleVariant("release") {
                withSourcesJar()
            }
        }
    // }
}

dependencies {
    api project(':IvyBase')
    // releaseApi("$mavenGroupId:IvyBase:$mavenPublishVersion")
    api project(':BlastAds')
    // releaseApi("$mavenGroupId:BlastAds:$mavenPublishVersion")

    implementation rootProject.ext.dependencies.xiaomi
//    implementation(rootProject.ext.dependencies.xiaomi_admob_adapter) {
//        exclude group: 'com.google.android.gms', module: 'play-services-ads'
//        exclude group: 'com.mi.ads', module: 'columbus-sdk'
//    }
    implementation(rootProject.ext.dependencies.xiaomi_max_adapter) {
        exclude group: 'com.applovin', module: 'applovin-sdk'
        exclude group: 'com.mi.ads', module: 'columbus-sdk'
    }
    implementation rootProject.ext.dependencies.user_messaging_platform
}
