ext {
    isMavenCentral = true
    mavenGroupId = "io.github.ivysdk"
    mavenPublishVersion = '1.0.0-test'
}

import groovy.json.JsonSlurper
import groovy.json.JsonOutput
if (isMavenCentral) {
    /**
     * 注意事项：
     * 1. 必须优先上传IvyBase，在MavenCentral管理页面发布成功后再上传其它模块
     * 2. Core模块必须在其它模块发布成功后方能上传发布
     * */

    apply plugin: 'maven-publish'
    mavenGroupId = "com.github.ivysdk"
    group = mavenGroupId
    mavenPublishVersion = '10.1.3'
    version = mavenPublishVersion

    afterEvaluate {
        publishing {
            publications {
                release(MavenPublication) {
                    from components.release
                    groupId = mavenGroupId
                    artifactId = project.name
                    version = mavenPublishVersion
                }
            }
        }
    }

