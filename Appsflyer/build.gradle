plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
}
apply {
    from ('../upload.gradle')
}

android {
    namespace 'com.ivy.appsflyer'
    compileSdk rootProject.ext.android.compileSdk

    defaultConfig {
        minSdk rootProject.ext.android.minSdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        debug {
            debuggable rootProject.ext.buildConfig.debug_debuggable
//            jniDebuggable rootProject.ext.buildConfig.debug_jniDebuggable
            minifyEnabled rootProject.ext.buildConfig.debug_minifyEnabled
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled rootProject.ext.buildConfig.release_minifyEnabled
            // shrinkResources rootProject.ext.buildConfig.release_shrinkResources
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    // if (!isMavenCentral) {
        publishing {
            singleVariant("release") {
                withSourcesJar()
            }
        }
    // }
}

dependencies {
    implementation 'androidx.media3:media3-common:1.1.1'
    debugApi project(':IvyBase')
    releaseApi("$mavenGroupId:IvyBase:$mavenPublishVersion")
    implementation rootProject.ext.dependencies.androidx_appcompat
    implementation rootProject.ext.dependencies.af_android_sdk
    implementation rootProject.ext.dependencies.installreferrer
    implementation rootProject.ext.dependencies.homereferrer


//    implementation project(':IvyBase')
//    implementation 'androidx.appcompat:appcompat:1.7.0'
//    implementation "com.appsflyer:af-android-sdk:6.17.2"
//    implementation "com.android.installreferrer:installreferrer:2.2"
//    implementation "com.miui.referrer:homereferrer:1.0.0.6"
}