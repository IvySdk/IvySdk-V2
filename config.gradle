tasks.register('updateSdkVersionCode') {
    group("project sync")
    doLast {
        def jsonFile = file("release_info.json")
        def json = new JsonSlurper().parse(jsonFile)
//        def json = new JsonSlurper().parse(new File("release_info.json"))
        def currentProjectVersion = json.version_name
        def versionFile = file("IvyBase/src/main/java/com/ivy/base/Version.java")
        if (!versionFile.exists()) {
            throw new GradleException("Version.java not found! failed to update sdk version code")
        }
        def text = versionFile.getText("UTF-8")
        text = text
                .replaceAll(
                        /public static final String SDK_VERSION_CODE\s*=\s*".*?";/,
                        "public static final String SDK_VERSION_CODE = \"${currentProjectVersion}\";"
                )

        versionFile.write(text, "UTF-8")
    }
}

