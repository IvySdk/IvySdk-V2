def execOps = services.get(ExecOperations.class)
import groovy.json.JsonSlurper
import groovy.json.JsonOutput

tasks.register("syncProjectVersionFiles") {
    group("project sync")
    doLast {

        def isMac = System.properties['os.name'].toLowerCase().contains('mac')
        def sharedDir

        if (isMac) {
            // macOS SMB 挂载路径
            sharedDir = file('/Volumes/pack_config/sdk')

            // 如果路径不存在，自动尝试挂载
            if (!sharedDir.exists()) {
                println "🔄 未检测到已挂载的共享目录，正在尝试挂载 SMB..."

                def mountCmd = [
                        'osascript', '-e',
                        'mount volume "smb://10.80.1.16/pack_config"'
                ]

                def proc = new ProcessBuilder(mountCmd).start()
                proc.waitFor()

                // 再检查一次
                if (!sharedDir.exists()) {
                    println "❌ 无法挂载 SMB 共享，请在 Finder ⌘+K，输入："
                    println "    smb://10.80.1.16/pack_config"
                    println ""
                    println "并确保挂载后路径为：/Volumes/pack_config"
                    return
                }

                println "✅ SMB 挂载成功!"
            }

        } else {
            // Windows UNC 路径
            sharedDir = file('\\\\10.80.1.16\\pack_config\\sdk')
        }
        def localDir = file("${projectDir}/sdk_version")

        if (sharedDir.exists() && sharedDir.isDirectory()) {
            println "✅ 检测到共享资源目录: ${sharedDir}"

            if (localDir.exists()) {
                println "🗑️ 删除本地旧资源..."
                localDir.deleteDir()
            }

            println "📁 正在复制新资源..."
            project.copy {
                from sharedDir
                into localDir
            }

            println "✅ 资源同步完成: ${localDir}"
        } else {
            println "⚠️ 未找到共享目录: ${sharedDir}"
        }
    }
}

tasks.register("uploadProjectVersionFiles") {
    group("project sync")
    doLast {
        def jsonFile = file("release_info.json")
        def json = new JsonSlurper().parse(jsonFile)
//        def release_note = new File('release_log.txt').getText("UTF-8")
        def logFile = file("release_log.txt")
        def release_note = logFile.exists() ? logFile.getText("UTF-8") : "默认更新日志内容"

        def currentProjectVersion = json.version_name
        println(currentProjectVersion)
        println(release_note)


        if (currentProjectVersion.trim().findAll("test").size() >= 2) {
            println("test version! stop upload")
            return
        }

        execOps.exec {
            commandLine 'git', 'tag', '-a', currentProjectVersion, '-m', release_note
        }
        println("start update sdk version files")
        def fileName = "sdk_version/" + currentProjectVersion + ".json"
        println("sdk version file:" + fileName)
        def newFile = new File(rootDir, fileName)
        if (newFile.exists()) {
            def reason = "update sdk version files for " + currentProjectVersion + " failed! file already exist"
            println(reason)
            throw new GradleException(reason)
//        println("file already exist; just delete it")
//        newFile.delete()
        }
        newFile.createNewFile()
        def template = new File(rootDir, "sdk_version/template.json")
        if (template == null) {
            throw new GradleException("template.json not found")
        }
        newFile.write(template.text, "UTF-8")
        println("sdk version file created")
        println("start add version num:" + currentProjectVersion + " to sdk version list")
        def versions = new File(rootDir, "sdk_version/sdk_versions.json")
        if (versions == null) {
            throw new GradleException("sdk_versions.json not found")
        }
        def content = versions.text
        if (content.contains("\"$currentProjectVersion\",")) {
            content = content.replace("\"$currentProjectVersion\",", "")
        }
        content = content.replace("[", "[\n  \"$currentProjectVersion\",")
        content = content.readLines()
                .findAll { !it.trim().isEmpty() }
                .join('\n')
        versions.write(content, "UTF-8")
        println("version num:" + currentProjectVersion + " added")
        println("start upload sdk version files to share folder")
        def sourceDir = new File(rootDir, "sdk_version")
        def destDir

        if (System.properties['os.name'].toLowerCase().contains('mac')) {
            destDir = file("/Volumes/pack_config/sdk")

            // 若未挂载则自动挂载共享目录
            if (!destDir.exists()) {
                println "🔄 尝试挂载 SMB 共享..."

                def mountCmd = [
                        'osascript', '-e',
                        'mount volume "smb://10.80.1.16/pack_config"'
                ]

                new ProcessBuilder(mountCmd).start().waitFor()

                if (!destDir.exists()) {
                    println "❌ 无法挂载共享目录，请手动执行 Finder ⌘+K 输入："
                    println "   smb://10.80.1.16/pack_config"
                    return
                }

                println "✅ SMB 挂载成功: ${destDir}"
            }

        } else {
            // Windows UNC
            destDir = file('\\\\10.80.1.16\\pack_config\\sdk')
        }

        // 删除目标文件夹中多余的文件
        project.delete {
            delete fileTree(destDir) {
                exclude '**/.keep'  // 可以排除某些不想删除的文件
            }
        }

        // 复制所有文件
        project.copy {
            from sourceDir
            into destDir
            include '**/*'
            eachFile { fcp -> fcp.duplicatesStrategy = DuplicatesStrategy.INCLUDE
            }
            includeEmptyDirs = true
        }
        println("sdk version files uploaded")
    }
}

tasks.register("uploadProject") {
    group("project sync")
    doLast {
        def jsonFile = file("release_info.json")
        def json = new JsonSlurper().parse(jsonFile)
        def currentProjectVersion = json.version_name//file.text.readLines().findAll { !it.trim().isEmpty() && it.trim().startsWith("mavenPublishVersion") }.join(",").replace(" ", "").replace("'", "").replace("mavenPublishVersion=", "").split(",")[2]
        println(currentProjectVersion)

        // 获取当前分支名
        def branchOutput = new ByteArrayOutputStream()
        execOps.exec {
            commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
            standardOutput = branchOutput
        }
        def currentBranch = branchOutput.toString().trim()
        println("current branch:" + currentBranch)
        def commitMsg = "$currentProjectVersion => ${new Date().format('yyyy-MM-dd HH:mm:ss')}"
        println(commitMsg)
        execOps.exec {
            commandLine 'git', 'add', '.'
        }
        execOps.exec {
            commandLine 'git', 'commit', '-m', commitMsg
        }
        execOps.exec {
            commandLine 'git', 'push', "origin", currentBranch
        }
        println "代码提交成功"
    }
}




